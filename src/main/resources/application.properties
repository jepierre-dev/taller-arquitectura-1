quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:coffee;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=

quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=true
# En prod no se carga import.sql por defecto; aqui la demo necesita catalogo inicial.
quarkus.hibernate-orm.sql-load-script=import.sql

# La API va bajo /api; la raiz queda libre para el frontend de META-INF/resources.
quarkus.rest.path=/api

# Render (y cualquier PaaS) inyecta el puerto por env; en local cae en 8080.
quarkus.http.port=${PORT:8080}
